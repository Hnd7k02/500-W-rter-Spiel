<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<title>Füfer – Nacht</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&amp;display=swap">
<style>
body{margin:0}
a{color:#EEF0F3}a:hover{color:#FFFFFF}
button{font-family:inherit}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; padding: 20px 16px 24px; display: flex; flex-direction: column; background: #0F1114; color: #EEF0F3; font-family: 'Space Grotesk', system-ui, sans-serif">
<header style="height: 48px; flex-shrink: 0; display: flex; align-items: center; justify-content: space-between">
<div style="display: flex; align-items: center; gap: 10px">
<div aria-hidden="true" style="width: 26px; height: 26px; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 3px">
<span style="border-radius: 4px; background: {{c.r}}"></span>
<span style="border-radius: 4px; background: {{c.v}}"></span>
<span style="border-radius: 4px; background: {{c.x}}"></span>
<span style="border-radius: 4px; background: #2B2F36"></span>
</div>
<span style="font-size: 20px; font-weight: 700; letter-spacing: 0.08em">FÜFER</span>
</div>
<div style="display: flex; align-items: center; gap: 8px">
<button type="button" aria-label="Spielregeln" style="width: 44px; height: 44px; padding: 0; border: 0; border-radius: 12px; background: #1B1E23; color: #EEF0F3; display: flex; align-items: center; justify-content: center; cursor: pointer"><svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"></circle><path d="M9.5 9.4a2.6 2.6 0 0 1 5 .9c0 1.7-2.5 2.2-2.5 3.7"></path><path d="M12 17.3h.01"></path></svg></button>
<button type="button" style="height: 44px; padding: 0 16px 0 12px; border: 0; border-radius: 12px; background: #EEF0F3; color: #0F1114; display: flex; align-items: center; gap: 8px; font-size: 15px; font-weight: 700; cursor: pointer"><svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3.5" y="3.5" width="17" height="17" rx="4.5"></rect><circle cx="8.6" cy="8.6" r="1.3" fill="currentColor" stroke="none"></circle><circle cx="15.4" cy="8.6" r="1.3" fill="currentColor" stroke="none"></circle><circle cx="12" cy="12" r="1.3" fill="currentColor" stroke="none"></circle><circle cx="8.6" cy="15.4" r="1.3" fill="currentColor" stroke="none"></circle><circle cx="15.4" cy="15.4" r="1.3" fill="currentColor" stroke="none"></circle></svg><span>Würfeln</span></button>
</div>
</header>
<main style="flex: 1; display: flex; align-items: center; justify-content: center">
<div style="display: flex; flex-direction: column; gap: 6px">
<sc-for list="{{done}}" as="row" hint-placeholder-count="4">
<div style="display: flex; align-items: center; gap: 12px">
<div style="display: flex; gap: 5px">
<sc-for list="{{row.cells}}" as="cell" hint-placeholder-count="5">
<button type="button" aria-label="{{cell.label}}" style="width: 44px; height: 44px; box-sizing: border-box; padding: 0; border: 0; border-radius: 8px; display: flex; align-items: center; justify-content: center; font-size: 22px; font-weight: 700; cursor: pointer; background: {{cell.bg}}; color: {{cell.fg}}">{{cell.ch}}</button>
</sc-for>
</div>
<div style="display: flex; gap: 4px">
<sc-for list="{{row.score}}" as="sc" hint-placeholder-count="3">
<div style="width: 32px; height: 44px; box-sizing: border-box; border-radius: 8px; display: flex; align-items: center; justify-content: center; font-size: 19px; font-weight: 700; background: {{sc.bg}}; color: {{sc.fg}}; border: 1px solid {{sc.bd}}">{{sc.n}}</div>
</sc-for>
</div>
</div>
</sc-for>
<div style="display: flex; align-items: center; gap: 12px">
<div style="display: flex; gap: 5px">
<sc-for list="{{active}}" as="cell" hint-placeholder-count="5">
<div style="width: 44px; height: 44px; box-sizing: border-box; border-radius: 8px; display: flex; align-items: center; justify-content: center; font-size: 22px; font-weight: 700; background: #0F1114; color: #EEF0F3; border: 2px solid {{cell.bd}}">{{cell.ch}}</div>
</sc-for>
</div>
<div style="display: flex; gap: 4px">
<div style="width: 32px; height: 44px; border-radius: 8px; background: #16191D"></div>
<div style="width: 32px; height: 44px; border-radius: 8px; background: #16191D"></div>
<div style="width: 32px; height: 44px; border-radius: 8px; background: #16191D"></div>
</div>
</div>
<sc-for list="{{empty}}" as="e" hint-placeholder-count="3">
<div style="display: flex; align-items: center; gap: 12px">
<div style="display: flex; gap: 5px">
<div style="width: 44px; height: 44px; border-radius: 8px; background: #1A1D22"></div>
<div style="width: 44px; height: 44px; border-radius: 8px; background: #1A1D22"></div>
<div style="width: 44px; height: 44px; border-radius: 8px; background: #1A1D22"></div>
<div style="width: 44px; height: 44px; border-radius: 8px; background: #1A1D22"></div>
<div style="width: 44px; height: 44px; border-radius: 8px; background: #1A1D22"></div>
</div>
<div style="display: flex; gap: 4px">
<div style="width: 32px; height: 44px; border-radius: 8px; background: #16191D"></div>
<div style="width: 32px; height: 44px; border-radius: 8px; background: #16191D"></div>
<div style="width: 32px; height: 44px; border-radius: 8px; background: #16191D"></div>
</div>
</div>
</sc-for>
</div>
</main>
<nav aria-label="Tastatur" style="flex-shrink: 0; display: flex; flex-direction: column; gap: 8px">
<div style="display: flex; gap: 6px">
<sc-for list="{{k1}}" as="k" hint-placeholder-count="10">
<button type="button" aria-label="{{k.label}}" style="flex: 1; min-width: 0; height: 52px; padding: 0; border: 0; border-radius: 8px; font-size: 15px; font-weight: 700; cursor: pointer; background: {{k.bg}}; color: {{k.fg}}">{{k.ch}}</button>
</sc-for>
</div>
<div style="display: flex; gap: 6px; padding: 0 18px">
<sc-for list="{{k2}}" as="k" hint-placeholder-count="9">
<button type="button" aria-label="{{k.label}}" style="flex: 1; min-width: 0; height: 52px; padding: 0; border: 0; border-radius: 8px; font-size: 15px; font-weight: 700; cursor: pointer; background: {{k.bg}}; color: {{k.fg}}">{{k.ch}}</button>
</sc-for>
</div>
<div style="display: flex; gap: 6px">
<button type="button" aria-label="Wort prüfen" style="flex: 1.6; min-width: 0; height: 52px; padding: 0; border: 0; border-radius: 8px; background: #EEF0F3; color: #0F1114; display: flex; align-items: center; justify-content: center; cursor: pointer"><svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 5v6.5a3 3 0 0 1-3 3H6"></path><path d="M10 10.5l-4 4 4 4"></path></svg></button>
<sc-for list="{{k3}}" as="k" hint-placeholder-count="7">
<button type="button" aria-label="{{k.label}}" style="flex: 1; min-width: 0; height: 52px; padding: 0; border: 0; border-radius: 8px; font-size: 15px; font-weight: 700; cursor: pointer; background: {{k.bg}}; color: {{k.fg}}">{{k.ch}}</button>
</sc-for>
<button type="button" aria-label="Buchstabe löschen" style="flex: 1.6; min-width: 0; height: 52px; padding: 0; border: 0; border-radius: 8px; background: #2B2F36; color: #EEF0F3; display: flex; align-items: center; justify-content: center; cursor: pointer"><svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M9 5h10.5A1.5 1.5 0 0 1 21 6.5v11a1.5 1.5 0 0 1-1.5 1.5H9l-6-7z"></path><path d="M12.5 9.5l5 5M17.5 9.5l-5 5"></path></svg></button>
</div>
</nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"richtig":{"editor":"color","default":"#3DB46D","options":["#3DB46D","#4CC38A","#2F9E61","#4EA8FF"],"section":"Farbstufen"},"vielleicht":{"editor":"color","default":"#E9BE45","options":["#E9BE45","#F5A524","#D9C66B","#FF9F43"],"section":"Farbstufen"},"falsch":{"editor":"color","default":"#E5534B","options":["#E5534B","#C84F4C","#F07167","#737B87"],"section":"Farbstufen"},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  hexRgb(value) {
    const s = String(value || '').trim();
    if (/^rgb/i.test(s)) {
      const p = s.match(/[\d.]+/g) || [];
      return [Number(p[0]) || 0, Number(p[1]) || 0, Number(p[2]) || 0];
    }
    let h = s.replace('#', '');
    if (h.length === 3 || h.length === 4) {
      h = h.slice(0, 3).split('').map((ch) => ch + ch).join('');
    }
    const n = parseInt(h.slice(0, 6), 16);
    if (isNaN(n)) return [0, 0, 0];
    return [(n >> 16) & 255, (n >> 8) & 255, n & 255];
  }

  tint(value, alpha) {
    const c = this.hexRgb(value);
    return 'rgba(' + c[0] + ', ' + c[1] + ', ' + c[2] + ', ' + alpha + ')';
  }

  blend(value, other, t) {
    const a = this.hexRgb(value);
    const b = this.hexRgb(other);
    const m = [0, 1, 2].map((i) => Math.round(a[i] + (b[i] - a[i]) * t));
    return 'rgb(' + m[0] + ', ' + m[1] + ', ' + m[2] + ')';
  }

  luma(value) {
    const c = this.hexRgb(value).map((v) => {
      const s = v / 255;
      return s <= 0.04045 ? s / 12.92 : Math.pow((s + 0.055) / 1.055, 2.4);
    });
    return 0.2126 * c[0] + 0.7152 * c[1] + 0.0722 * c[2];
  }

  inkOn(value, dark, light) {
    return this.luma(value) > 0.2 ? dark : light;
  }

  renderVals() {
    // Nah am Original, aber ruhiger: Falsch gedämpft, Nullen treten zurück
    const c = {
      r: this.props.richtig ?? '#3DB46D',
      v: this.props.vielleicht ?? '#E9BE45',
      x: this.props.falsch ?? '#E5534B'
    };
    const look = {
      r: { bg: c.r, fg: this.inkOn(c.r, '#07180E', '#FFFFFF') },
      v: { bg: c.v, fg: this.inkOn(c.v, '#231A00', '#FFFFFF') },
      x: { bg: this.tint(c.x, 0.2), fg: this.blend(c.x, '#FFFFFF', 0.3) },
      n: { bg: '#262A31', fg: '#EEF0F3' }
    };
    const keyLook = {
      r: look.r,
      v: look.v,
      x: { bg: this.tint(c.x, 0.15), fg: this.blend(c.x, '#FFFFFF', 0.35) },
      n: { bg: '#2B2F36', fg: '#EEF0F3' }
    };
    const name = { r: 'richtig', v: 'vielleicht', x: 'falsch', n: 'nicht markiert' };

    // Beispielpartie: Lösung BRAVE, vier Versuche, Zeile 5 wird getippt
    const guesses = [
      { w: 'STONE', m: 'xxxxv', s: [1, 0, 4] },
      { w: 'CLAIM', m: 'xxrxx', s: [1, 0, 4] },
      { w: 'GRAPH', m: 'xrrxx', s: [2, 0, 3] },
      { w: 'BREAD', m: 'rrvvx', s: [2, 2, 1] }
    ];
    const input = 'BRA';

    const done = guesses.map((g) => ({
      cells: g.w.split('').map((ch, i) => {
        const m = look[g.m[i]] ? g.m[i] : 'n';
        return { ch: ch, bg: look[m].bg, fg: look[m].fg, label: ch + ', ' + name[m] };
      }),
      score: ['r', 'v', 'x'].map((k, i) => {
        const count = g.s[i];
        if (count > 0) {
          return { n: String(count), bg: look[k].bg, fg: look[k].fg, bd: 'transparent' };
        }
        return { n: '0', bg: 'transparent', fg: '#7A818C', bd: '#2A2E35' };
      })
    }));

    const active = [0, 1, 2, 3, 4].map((i) => ({
      ch: input.charAt(i),
      bd: i < input.length ? '#EEF0F3' : (i === input.length ? '#5D636D' : '#2A2E35')
    }));

    const rank = { x: 1, v: 2, r: 3 };
    const best = {};
    guesses.forEach((g) => {
      g.w.split('').forEach((ch, i) => {
        const m = g.m[i];
        if (rank[m] && (!best[ch] || rank[m] > rank[best[ch]])) best[ch] = m;
      });
    });
    const keys = (row) => row.split('').map((ch) => {
      const m = best[ch] || 'n';
      return {
        ch: ch,
        bg: keyLook[m].bg,
        fg: keyLook[m].fg,
        label: m === 'n' ? ch : ch + ', ' + name[m]
      };
    });

    return {
      c: c,
      done: done,
      active: active,
      empty: [{ id: 6 }, { id: 7 }, { id: 8 }],
      k1: keys('QWERTYUIOP'),
      k2: keys('ASDFGHJKL'),
      k3: keys('ZXCVBNM')
    };
  }
}
</script>
</body>
</html>
