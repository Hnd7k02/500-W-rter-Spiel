name: Deploy auf GitHub Pages

# Jeder Push auf main veröffentlicht die App automatisch. Von Hand: Actions → Run workflow.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test
      - name: Build
        run: npm run build
        env:
          # Auf GitHub Pages liegt die App unter /<repo-name>/
          BASE_PATH: /${{ github.event.repository.name }}/
      - uses: actions/upload-pages-artifact@v4
        with:
          path: dist

  # Ist GitHub Pages noch nicht eingerichtet, endet der Lauf mit einem Hinweis statt mit einem Fehler.
  pages:
    runs-on: ubuntu-latest
    outputs:
      ready: ${{ steps.check.outputs.ready }}
    steps:
      - id: check
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if result=$(gh api "repos/${GITHUB_REPOSITORY}/pages" --jq .build_type 2>&1); then
            if [ "$result" = "workflow" ]; then
              echo "ready=true" >> "$GITHUB_OUTPUT"
            else
              echo "ready=false" >> "$GITHUB_OUTPUT"
              echo "::warning title=GitHub Pages::Unter Settings → Pages → Source «GitHub Actions» wählen und diesen Workflow erneut starten."
            fi
          elif echo "$result" | grep -q "HTTP 404"; then
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::warning title=GitHub Pages ist noch nicht eingerichtet::Repo öffentlich machen, unter Settings → Pages → Source «GitHub Actions» wählen und diesen Workflow erneut starten."
          else
            echo "::error::Status von GitHub Pages nicht lesbar: $result"
            exit 1
          fi

  deploy:
    needs: [build, pages]
    if: needs.pages.outputs.ready == 'true'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
