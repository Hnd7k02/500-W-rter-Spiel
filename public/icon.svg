<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <title>500 Wörter</title>
  <defs>
    <radialGradient id="glow" cx="256" cy="-60" r="520" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="0.62" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="green" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#36C670"/>
      <stop offset="1" stop-color="#128A47"/>
    </linearGradient>
    <linearGradient id="amber" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFD45E"/>
      <stop offset="1" stop-color="#FFAD1F"/>
    </linearGradient>
    <linearGradient id="red" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FF8F8B"/>
      <stop offset="1" stop-color="#EE5560"/>
    </linearGradient>
    <linearGradient id="sheen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.42"/>
      <stop offset="0.52" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
    <filter id="soft" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="12"/>
    </filter>
  </defs>

  <rect width="512" height="512" fill="#F1F2F6"/>
  <rect width="512" height="512" fill="url(#glow)"/>

  <!-- farbige Schatten unter den Kacheln -->
  <rect x="71" y="217" width="98" height="108" rx="30" fill="#128A47" fill-opacity="0.5" filter="url(#soft)"/>
  <rect x="207" y="217" width="98" height="108" rx="30" fill="#FFA514" fill-opacity="0.5" filter="url(#soft)"/>
  <rect x="343" y="217" width="98" height="108" rx="30" fill="#E0424E" fill-opacity="0.45" filter="url(#soft)"/>

  <!-- drei glänzende Kacheln: Grün, Amber, Hellrot (innerhalb der sicheren Zone für maskierbare Icons) -->
  <g>
    <rect x="59" y="195" width="122" height="122" rx="36" fill="url(#green)"/>
    <rect x="59" y="195" width="122" height="122" rx="36" fill="url(#sheen)"/>
    <rect x="59.75" y="195.75" width="120.5" height="120.5" rx="35.25" fill="none" stroke="#FFFFFF" stroke-opacity="0.22" stroke-width="1.5"/>
  </g>
  <g>
    <rect x="195" y="195" width="122" height="122" rx="36" fill="url(#amber)"/>
    <rect x="195" y="195" width="122" height="122" rx="36" fill="url(#sheen)"/>
    <rect x="195.75" y="195.75" width="120.5" height="120.5" rx="35.25" fill="none" stroke="#FFFFFF" stroke-opacity="0.3" stroke-width="1.5"/>
  </g>
  <g>
    <rect x="331" y="195" width="122" height="122" rx="36" fill="url(#red)"/>
    <rect x="331" y="195" width="122" height="122" rx="36" fill="url(#sheen)"/>
    <rect x="331.75" y="195.75" width="120.5" height="120.5" rx="35.25" fill="none" stroke="#FFFFFF" stroke-opacity="0.26" stroke-width="1.5"/>
  </g>
</svg>
